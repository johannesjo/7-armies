name: Deploy to GitHub Pages

# Publishes every branch to GitHub Pages via the `gh-pages` branch:
#   main            -> https://<owner>.github.io/<repo>/
#   any other branch -> https://<owner>.github.io/<repo>/branches/<branch-slug>/
# Previews are removed again when their branch is deleted.
#
# Requires: Settings -> Pages -> Source = "Deploy from a branch", branch `gh-pages` / (root).

on:
  push:
    branches: ['**', '!gh-pages']
  delete:
  workflow_dispatch:

permissions:
  contents: write

# One run per branch at a time; a newer push supersedes an older build of the same branch.
concurrency:
  group: pages-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

env:
  PAGES_BRANCH: gh-pages

jobs:
  deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute target path
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            dir=""
          else
            slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            dir="branches/$slug"
          fi
          base="/$REPO/${dir:+$dir/}"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "url=https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io$base" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -- --base="${{ steps.target.outputs.base }}"

      - name: Publish to ${{ env.PAGES_BRANCH }}
        env:
          DIR: ${{ steps.target.outputs.dir }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/publish-pages.sh deploy "$DIR" dist "Deploy $BRANCH@${SHA::7}"

      - name: Summary
        run: |
          echo "### Deployed to GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.target.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Remove preview
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          bash .github/scripts/publish-pages.sh remove "branches/$slug" "" "Remove preview for $BRANCH"
